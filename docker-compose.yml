services:
  postgres:
    image: postgres:15-alpine
    container_name: yokai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-yokai_hardware_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/ops/crear_roles.sql:/docker-entrypoint-initdb.d/01_crear_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-yokai_hardware_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
