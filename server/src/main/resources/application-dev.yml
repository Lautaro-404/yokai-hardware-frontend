spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yokai_hardware_db}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: YokaiHikariDevPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    fail-on-missing-locations: false
    locations:
      - filesystem:db/migration
      - filesystem:../db/migration
      - filesystem:db/seed
      - filesystem:../db/seed
      - filesystem:db/seed/dev
      - filesystem:../db/seed/dev
    clean-disabled: false

server:
  port: ${PORT:8080}
